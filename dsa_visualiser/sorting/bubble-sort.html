<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bubble Sort Visualizer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h2>Bubble Sort Visualizer</h2>
  <div id="controls">
    <button onclick="startSort()">Start Sorting</button>
    <button onclick="resetArray()">Reset</button>
  </div>
  <div id="bars-container"></div>
  <div class="description">
    <h3>How Bubble Sort Works:</h3>
    <p>
      Bubble Sort repeatedly compares adjacent elements and swaps them if they’re in the wrong order.
      This process continues until the list is sorted.
    </p>
  </div>
  
  <script src="bubble-sort.js"></script>
</body>
</html>
