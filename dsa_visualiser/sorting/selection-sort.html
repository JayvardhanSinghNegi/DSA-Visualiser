<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Selection Sort Visualizer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h2>Selection Sort Visualizer</h2>
  <div id="controls">
    <button onclick="startSort()">Start Sorting</button>
    <button onclick="resetArray()">Reset</button>
    
  </div>
  <div id="bars-container"></div>
  <div class="description">
    <h3>How Selection Sort Works:</h3>
    <p>
      Selection Sort repeatedly selects the smallest element from the unsorted portion
      and places it at the beginning of the sorted portion.
    </p>
  </div>
  
  <script src="selection-sort.js"></script>
</body>
</html>
