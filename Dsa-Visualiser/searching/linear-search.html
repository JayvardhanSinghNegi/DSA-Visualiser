<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Linear Search Visualizer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h2>Linear Search Visualizer</h2>
  <div id="controls">
    <label for="target-select">Choose a number:</label>
    <select id="target-select"></select>
    <button onclick="startSearch()">Start Search</button>
    <button onclick="resetArray()">Reset</button>
    <a href="index.html" class="algo-button">Back to Home</a>
  </div>
  <div id="bars-container"></div>

  <div class="description">
    <h3>How Linear Search Works:</h3>
    <p>
      Linear Search checks each element of the array one by one until the target element is found or the list ends.
      It’s simple and works on any array but is inefficient for large datasets.
    </p>
  </div>

  <script src="linear-search.js"></script>
</body>
</html>
